// The message bodies of the agent protocol, which impd and the guest agent
// speak over vsock (docs/architecture/guest/protocol.md). This file is the
// source of truth: `bun run gen:proto` writes the Go types, impd's
// TypeScript types and the reference in
// docs/reference/agent-protocol.md from it.
//
// The wire stays JSON: each side writes the proto3 JSON form with the field
// names below, and reads it back ignoring the fields it does not know. Frames,
// the type byte and the length prefix, stay hand-written in each codec.
//
// Two rules keep the JSON what agents before this schema sent and read:
//
// - A 64-bit count (a byte offset, a size, an inode, a time in Unix ms) is a
//   double. The JSON form of int64 is a string, which an older agent rejects
//   in a request; a double stays a JSON number, exact up to 2^53, the most
//   impd's JavaScript holds anyway.
// - A field the sender leaves out when it has nothing to say is optional. The
//   agent writes every field that is not, zero or not; impd leaves a zero out,
//   which an agent reads as zero.
syntax = "proto3";

package imp.agent.v1;

option go_package = "github.com/zgeoff/impz/agent/internal/proto;proto";

// The REQUEST frame: the first frame on every connection. Each op reads its
// own fields and leaves the rest unset.
message Request {
  // The operation: ping, exec, exec.outer, freeze, thaw, activity, resumed,
  // shutdown, grow, claim, dial, listen, agent.listen, agent.accept,
  // session.attach, session.kill, session.tap, services.list, services.add,
  // services.remove, services.restart, services.logs, files.write or
  // files.remove.
  string op = 1;

  // exec, exec.outer: the command and its arguments.
  repeated string argv = 2;
  // exec, exec.outer: KEY=value entries added to the environment.
  repeated string env = 3;
  // exec, exec.outer: the working directory.
  optional string cwd = 4;
  // exec, exec.outer: whether the command gets a tty.
  optional bool tty = 5;
  // exec, exec.outer, session.attach: the tty's width.
  optional uint32 cols = 6;
  // exec, exec.outer, session.attach: the tty's height.
  optional uint32 rows = 7;
  // exec, exec.outer: the user the command runs as.
  optional string user = 8;

  // exec, exec.outer: once a host stop signal arrives and the process exits,
  // the rest of its process group gets this long, counted from the signal,
  // before SIGKILL. 0 leaves the group alone.
  optional uint32 kill_grace_ms = 9;

  // exec, session.attach, session.kill, session.tap: the session name.
  optional string session = 10;

  // exec that starts a session: impd keeps a log of its output, so the agent
  // marks it for a tap.
  optional bool log = 11;

  // exec with a session, session.attach, session.tap: resume the output after
  // the last byte the client saw, rather than replay it.
  ResumeFrom resume_from = 12;

  // freeze: auto-thaw after this many ms (default 30000).
  optional uint32 timeout_ms = 13;

  // resumed: the host's wall clock, in Unix ms.
  optional double unix_ms = 14;

  // dial, listen: "tcp" or "unix".
  optional string network = 15;
  // dial: "host:port" for tcp, or a socket path for unix. listen:
  // "127.0.0.1:port" for tcp, or for unix a path, or "" for one the agent
  // makes.
  optional string address = 16;

  // agent.accept: the listener a CONNECTION frame came on.
  optional string listener = 17;
  // agent.accept: the id the CONNECTION frame named.
  optional uint32 connection = 118;

  // grow: the disk's new size in bytes.
  optional double disk_bytes = 19;

  // claim: the values a cold boot reads from the kernel cmdline, and more.
  Claim claim = 20;

  // services.remove, services.restart, services.logs: the service name.
  optional string service = 21;

  // services.add: the definition.
  ServiceDef def = 22;
  // services.add: whether the definition may replace one of the same name.
  optional bool replace = 23;

  // services.logs: how many lines of the log to send first.
  optional uint32 lines = 24;
  // services.logs: whether to keep sending what the service writes.
  optional bool follow = 25;
  // services.logs: send everything after this place, in place of lines.
  LogCursor cursor = 26;

  // files.write, files.remove: the file's path under the read-only files
  // root, 1 to 8 segments joined by "/" (docs/architecture/guest/agent.md#read-only-files).
  optional string path = 27;
  // files.write: the file's content, at most 512 KiB.
  optional bytes data = 28;
}

// A session's generation, and the offset of the first output byte the client
// lacks.
message ResumeFrom {
  string execution_generation = 1;
  double offset = 2;
}

// A place in a service's log: the file, by inode, and the offset after the
// last byte sent. The CURSOR frame, and a services.logs request.
message LogCursor {
  double inode = 1;
  double offset = 2;
}

// What a guest restored from a boot template needs to become one imp
// (docs/architecture/lifecycle/boot-templates.md#restore). The seed is mixed
// into the kernel's entropy pool before the CRNG reseeds.
message Claim {
  string id = 1;
  string hostname = 2;
  // an address with its prefix length, and the gateway
  string ip = 3;
  string gw = 4;
  optional string ip6 = 5;
  optional string gw6 = 6;
  repeated string dns = 7;
  string mac = 8;
  optional double disk_bytes = 9;
  double unix_ms = 10;
  // base64 in JSON
  bytes seed = 11;
  optional bool reset_identity = 12;
}

// The RESPONSE payload for a failed request.
message ErrorResponse {
  Error error = 1;
}

message Error {
  // BAD_REQUEST, UNKNOWN_OP, EXEC_FAILED, INNER_DOWN (the inner container,
  // where every process runs, is down), FROZEN, POWERING_OFF, INTERNAL,
  // NO_SESSION, INVALID_RESUME (a resume named an offset past the end of the
  // generation it names), SESSION_LIMIT, DIAL_FAILED, NO_CONNECTION,
  // LISTEN_FAILED, NO_SERVICE, SERVICE_EXISTS or NO_SPACE (the read-only
  // files have no room for a write). A reader keeps it a string: a newer
  // agent may send a code it does not know.
  string code = 1;
  string message = 2;
  // the code's detail, for NO_SESSION and INVALID_RESUME
  ErrorData data = 3;
}

// The detail of an error. NO_SESSION sets boot_id, this boot, and previous,
// the generation that last ran under the name in it. INVALID_RESUME sets end
// and buffer_start, where the generation's output stands.
message ErrorData {
  optional string boot_id = 1;
  Previous previous = 2;
  optional double end = 3;
  optional double buffer_start = 4;
}

// The RESPONSE to ping.
message Ping {
  bool ok = 1;
  // the agent protocol version
  string version = 2;
  // unset when the guest clock cannot be read: impd then skips its
  // young-guest wait before a sleep
  optional double uptime_ms = 3;
  // set on a boot that reset a template copy's identity: ok, or failed when
  // impd must ask again on the next boot
  optional string identity_reset = 4;
  // "template" while the agent waits for a claim; unset once it serves
  optional string stage = 5;
  // the inner container's state; unset by an agent before 0.14.0
  InnerStatus inner = 6;
  // the guest kernel's boot_id: a wake from memory keeps it, every cold boot
  // changes it
  optional string boot_id = 7;
}

// The inner container's state: whether it runs, how often it started again
// after its init died, and why the last start failed.
message InnerStatus {
  bool up = 1;
  uint32 restarts = 2;
  optional string last_error = 3;
}

// The RESPONSE to a unary request that has nothing more to say.
message OK {
  bool ok = 1;
}

// The RESPONSE to files.remove.
message FilesRemoved {
  // whether a file was there to remove
  bool removed = 1;
}

// The RESPONSE to agent.listen and listen.
message Listening {
  bool ok = 1;
  // the unix socket (for agent.listen, SSH_AUTH_SOCK)
  optional string path = 2;
  // the TCP port, which a request for port 0 learns here
  optional uint32 port = 3;
  string listener = 4;
}

// The CONNECTION payload: a client waits on the socket for an agent.accept
// with this id.
message Connection {
  uint32 id = 1;
}

// The RESPONSE to activity.
message Activity {
  uint32 tcp_established = 1;
  // open exec, exec.outer and session.attach connections
  uint32 exec_sessions = 2;
  double load1 = 3;
  repeated SessionInfo sessions = 4;
}

// A session as activity lists it.
message SessionInfo {
  string name = 1;
  int32 pid = 2;
  repeated string argv = 3;
  // running or exited
  string state = 4;
  bool attached = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  // the guest wall clock when the session started, in Unix ms
  double started_unix_ms = 8;
  // set once the process exited and its output drained
  Exit exit = 9;
  // this run of the session's process, and the offset after the last output
  // byte so far
  string execution_generation = 10;
  string boot_id = 11;
  double end = 12;
  // set for a session started with log, which impd taps
  optional bool log = 13;
}

// One services.d file, and a service's definition in services.add and
// services.list. The file name is the name; a name field in the file is
// ignored.
message ServiceDef {
  optional string name = 1;
  repeated string argv = 2;
  repeated string env = 3;
  optional string cwd = 4;
  optional string user = 5;
  // always (the default), on-failure or never
  optional string restart = 6;
  // api for a file services.add wrote, else image; the agent sets it, impd
  // never sends it
  optional string source = 7;
}

message ServiceStatus {
  string name = 1;
  // starting, running, backoff, stopped or exited
  string state = 2;
  optional int32 pid = 3;
  uint32 restarts = 4;
  Exit last_exit = 5;
  // the definition the service runs, as read from its file; unset by an agent
  // before the services API
  ServiceDef def = 6;
  // whether the service runs as uid 0, or as a user the guest cannot resolve;
  // the agent always sets it, and a reader takes an agent from before the
  // services API, which leaves it unset, as root
  optional bool root = 7;
}

// The RESPONSE to services.list.
message ServicesList {
  repeated ServiceStatus services = 1;
  // the image's user, which a service without one runs as
  string image_user = 2;
}

// The STARTED payload.
message Started {
  int32 pid = 1;
  // set on a session connection; created is false when the connection
  // attached to a session that already ran
  optional string session = 2;
  optional bool created = 3;
  // echoes a non-tty exec's kill_grace_ms, as clamped, so the host knows this
  // agent kills a stopped command's group; older agents leave it unset
  optional uint32 kill_grace_ms = 4;
  // set on a session connection: where its output stands, and where the data
  // that follows starts
  Output output = 5;
}

// Places a session connection's data in the generation's output. Offsets
// count the pty output bytes of one generation from 0.
message Output {
  string boot_id = 1;
  string execution_generation = 2;
  // the first byte the raw ring still holds, and the offset after the last
  // byte written so far
  double buffer_start = 3;
  double end = 4;
  // the offset of the first data byte this connection sends; prelude counts
  // the mode bytes sent before it, which have no offset
  double offset = 5;
  uint32 prelude = 6;
  // the last generation under this name that ended and was replaced or
  // removed, in this boot
  Previous previous = 7;
  // set when the request had resume_from
  Resume resume = 8;
  // set for a session started with log
  optional bool log = 9;
}

// A generation whose process ended: its end and exit are final.
message Previous {
  string execution_generation = 1;
  double end = 2;
  Exit exit = 3;
}

// How a resume_from was met. Each kind sets only its own fields: exact sets
// none; gap sets from and to, the bytes [from, to) that are gone;
// generation_changed sets execution_generation and first_offset, when the
// named generation is not the one running and the data is this one's from
// first_offset.
message Resume {
  string kind = 1;
  optional double from = 2;
  optional double to = 3;
  optional string execution_generation = 4;
  optional double first_offset = 5;
}

// The DETACHED payload: why the guest ended a session connection without an
// EXIT. taken_over or slow.
message Detached {
  string reason = 1;
}

// The RESIZE frame: a tty's size.
message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// The SIGNAL frame: a Linux signal number for the process group.
message Signal {
  int32 signal = 1;
}

// The EXIT payload: how a process ended. When signal is set, code is
// 128+signal, as a shell reports it.
message Exit {
  int32 code = 1;
  int32 signal = 2;
}
