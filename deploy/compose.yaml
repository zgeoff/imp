# imp host under Docker Compose. One of the two supported ways to run the
# release image; deploy/imp-host.service is the other. Run one, not both.
#
#   docker compose -f deploy/compose.yaml up -d
#   (with ZFS: docker compose -f deploy/compose.yaml -f deploy/compose.zfs.yaml up -d)
#   deploy/upgrade.sh --compose deploy/compose.yaml   to a new image
#
# /var/lib/imp on the host must be XFS with reflink (docs/guides/install.md),
# or, with IMP_STORAGE_BACKEND=zfs, IMP_ZFS_ROOT a legacy-mounted dataset the
# container mounts itself (docs/architecture/storage.md#zfs). The container
# refuses to start otherwise.
#
# imp-host reaches Docker through imp-docker-proxy, never the host's socket
# (docs/architecture/host-contract.md#the-docker-socket). That closes the
# Docker socket path only: imp-host keeps SYS_ADMIN, which still lets root
# out of the container. The proxy joins the group of /var/run/docker.sock:
# set IMP_DOCKER_GID to `stat -c %g /var/run/docker.sock` in the shell or a
# .env next to this file (deploy/upgrade.sh --compose sets it).
#
# The image defaults to this file's own release. deploy/upgrade.sh --compose
# writes the image it moves to as IMP_HOST_IMAGE in that .env, so a later
# `up -d` with this file keeps it; set it there yourself to pin another.
name: imp

services:
  imp-docker-proxy:
    image: ${IMP_HOST_IMAGE:-ghcr.io/zgeoff/imp-host:0.28.1} # x-release-please-version
    container_name: imp-docker-proxy
    command: ['/usr/local/bin/imp-docker-proxy']
    # proxy privileges: from deploy/imp-host.args.json (bun run render:deploy)
    read_only: true
    network_mode: 'none'
    user: '65534:65534'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp
    # end of proxy privileges
    group_add:
      - ${IMP_DOCKER_GID:?set IMP_DOCKER_GID to the group of /var/run/docker.sock (stat -c %g
        /var/run/docker.sock)}
    # not the env file, which holds the Tailscale key: set a different
    # IMP_BUILD_CONTEXT_MAX_MIB here too, in the shell or .env
    environment:
      IMP_HOST_IMAGE: ${IMP_HOST_IMAGE:-ghcr.io/zgeoff/imp-host:0.28.1} # x-release-please-version
      IMP_BUILD_CONTEXT_MAX_MIB: ${IMP_BUILD_CONTEXT_MAX_MIB:-1024}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # new volumes take the image's directories, owned by the proxy's user
      - imp-docker:/run/imp-docker
      - imp-docker-proxy:/var/lib/imp-docker-proxy
    healthcheck:
      test: ['CMD', 'test', '-S', '/run/imp-docker/docker.sock']
      interval: 2s
      retries: 15
    restart: unless-stopped

  imp-host:
    image: ${IMP_HOST_IMAGE:-ghcr.io/zgeoff/imp-host:0.28.1} # x-release-please-version
    container_name: imp-host
    # restic's backup locks name the host: a fixed one lets impd drop a lock
    # its own crashed run left (docs/architecture/backups.md)
    hostname: imp-host
    # Not privileged: docs/architecture/host-contract.md#privileges. The
    # seccomp profile is deploy/imp-host.seccomp.json. With
    # IMP_STORAGE_BACKEND=zfs, add deploy/compose.zfs.yaml for /dev/zfs; on a
    # host booted with ipv6.disable=1, drop the net.ipv6 sysctls.
    # privileges: from deploy/imp-host.args.json (bun run render:deploy)
    init: true
    cgroup: private
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - MKNOD
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_PTRACE
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETFCAP
    security_opt:
      - apparmor=unconfined
      - seccomp=/etc/imp/imp-host.seccomp.json
    devices:
      - /dev/kvm
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.accept_ra=0
      - net.ipv6.conf.default.accept_redirects=0
      - net.ipv6.conf.default.disable_ipv6=0
    # end of privileges
    env_file:
      - path: ${IMP_HOST_ENV_FILE:-/etc/imp/imp-host.env}
        required: true
    # impd pulls and builds imp images through the proxy's socket
    environment:
      DOCKER_HOST: unix:///run/imp-docker/docker.sock
    depends_on:
      imp-docker-proxy:
        condition: service_healthy
    volumes:
      - ${IMP_HOST_DATA:-/var/lib/imp}:/var/lib/imp
      - imp-docker:/run/imp-docker:ro
      # the restic password file for backups (docs/architecture/backups.md)
      - /etc/imp:/etc/imp:ro
    # Local only: the tailnet reaches impd and every imp through the
    # container's own tailscaled, so nothing else is published.
    ports:
      - 127.0.0.1:7070:7070
      - 127.0.0.1:7080:7080
      # Public imps (docs/guides/https.md#public-imps), with IMP_PUBLIC_IP
      # set: uncomment both to publish impd's public listeners as the host's
      # 443 and 80. They serve public imps only.
      # - 443:7443
      # - 80:7480
    # Imps' IPv6 (docs/guides/install.md#ipv6): uncomment these two lines
    # and the networks block below, and set IMP_HOST_SUBNET6 to a unique
    # local /64 in the shell or a .env next to this file.
    # networks:
    #   - imp-host
    # SIGTERM makes impd sleep every awake imp, so memory survives; give it
    # the time (docs/guides/operations.md).
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  imp-docker:
  imp-docker-proxy:

# The same network as create_host_network in deploy/bootstrap.sh and the
# ExecStartPre of deploy/imp-host.service; keep the three equal.
# networks:
#   imp-host:
#     name: imp-host
#     enable_ipv6: true
#     driver_opts:
#       com.docker.network.bridge.name: br-imphost
#     ipam:
#       config:
#         - subnet: ${IMP_HOST_SUBNET6:?set IMP_HOST_SUBNET6 to a /64}
