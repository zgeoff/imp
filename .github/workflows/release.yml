name: Release

# Builds a release and publishes it (RELEASING.md): the host image to GHCR,
# the CLI binaries, the guest kernel, the system drive and SHA256SUMS to the
# GitHub release, the Homebrew formula to the tap, and @zgeoff/imp-client to
# npm, the last two once they are turned on.
#
# - Started by ci.yml's release-please job with the tag it just created.
# - Run by hand with a tag to republish an existing release. Every step is
#   safe to repeat: assets upload with --clobber, and `latest` moves only
#   when the tag is the newest release. The base job never pushes over an
#   existing imp-base tag, and skips a release from before imp-base.
# - Run by hand with no tag for a dry run of the current commit: it builds,
#   checks, pushes imp-host:dryrun-<sha> and imp-base:dryrun-<sha> and
#   attests them, but uploads nothing to a release and leaves `latest` alone.
#
# Nothing is pushed until every CLI binary has passed on its own platform.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and publish; empty for a dry run
        required: false
        type: string
        default: ''

permissions: {}

# one run per release; a second run for the same tag waits for the first
concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  LEFTHOOK: 0
  IMAGE: ghcr.io/${{ github.repository_owner }}/imp-host
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/imp-base

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      push_tag: ${{ steps.version.outputs.push_tag }}
    steps:
      - name: Check tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi

      # a republish builds the tag, never main's head
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      # A release's version is its tag without the v; package.json must agree,
      # which the image check enforces. A dry run takes package.json's version
      # and pushes under a tag of its own.
      - name: Version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            version=${TAG#v}
            push_tag=$version
          else
            version=$(jq -r .version package.json)
            push_tag=dryrun-${GITHUB_SHA::12}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push_tag=$push_tag" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # type=gha cache needs the runtime token and URL in the environment,
      # which only actions get by default
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # mode=max keeps the kernel layer, for the image job and the next
      # release
      - name: Build assets
        run: >-
          scripts/build-release-assets.sh --cache-from type=gha,scope=system-files --cache-to
          type=gha,scope=system-files,mode=max

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Each CLI binary runs on its own platform; the assets job cross-compiled
  # them.
  smoke:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Check the binary and its checksum
        env:
          BIN: imp-${{ matrix.target }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          cd dist
          grep "  $BIN\$" SHA256SUMS | shasum -a 256 -c -
          chmod +x "$BIN"
          got=$("./$BIN" --version)
          if [ "$got" != "$VERSION" ]; then
            echo "$BIN --version is $got, want $VERSION" >&2
            exit 1
          fi
          # the Homebrew formula generates the completions at install time
          for shell in bash zsh fish; do
            "./$BIN" completion "$shell" > /dev/null
          done

  # Builds the image from the same commit, with the kernel and the drive from
  # the assets job's cache, then checks the image's copies against
  # SHA256SUMS before anything is pushed.
  image:
    needs: [assets, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Loads into the runner's docker, so the image checked is the image
      # pushed.
      - name: Build image
        env:
          IMP_VERSION: ${{ needs.assets.outputs.version }}
          IMP_RELEASE_IMAGE: ${{ env.IMAGE }}
        run: >-
          host/build-release.sh --cache-from type=gha,scope=system-files --cache-from
          type=gha,scope=imp-host --cache-to type=gha,scope=imp-host,mode=max

      - name: Check image
        env:
          VERSION: ${{ needs.assets.outputs.version }}
        run: host/check-release-image.sh "$IMAGE:$VERSION" "$VERSION" dist/SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The digest comes from the registry, after the push, so the
      # attestation names exactly what was pushed.
      - name: Push image
        id: push
        env:
          VERSION: ${{ needs.assets.outputs.version }}
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
        run: |
          if [ "$PUSH_TAG" != "$VERSION" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:$PUSH_TAG"
          fi
          docker push "$IMAGE:$PUSH_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$PUSH_TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # Publishes images/base as imp-base:<push_tag>, the base other images
  # build FROM by digest. A published tag never moves: when the tag exists,
  # as on a republish of a release that has its base or a second dry run of
  # one commit, the job leaves it alone and stays green. It skips a release
  # from before imp-base, and attests an existing tag that has no
  # attestation. The concurrency group keeps two runs for one tag apart
  # between the check and the push.
  # imp-base has no `latest`. Publish does not wait for this job: consumers
  # pin a digest, so a base failure must not hold up a release.
  base:
    needs: [assets, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # before the check, so a missing tag answers "not found" rather than an
      # anonymous token error
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Decides what the job does, before any build:
      # - skip: the tree predates imp-base (every tag up to v0.27.0 has an
      #   unpinned images/base and no check script), or the tag exists with
      #   this repository's attestation;
      # - attest: the tag exists but has no attestation, as after a run that
      #   pushed and then failed to attest; the existing digest is attested,
      #   and nothing is pushed again;
      # - push: the registry answers "not found" for the tag.
      # Any other registry answer fails, so a 401, a 403 or a network error
      # never reads as a missing tag. A failed verify only attests again,
      # which is harmless: the tag never moves.
      - name: Plan
        id: plan
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$BASE_IMAGE:$PUSH_TAG
          if [ ! -f host/check-base-image.sh ] || ! grep -q '^ARG DOCKER_CE_VERSION=' images/base/Dockerfile; then
            echo "::notice::this tree predates the published imp-base, so $ref is not built"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if out=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1); then
            digest=$out
            if gh attestation verify "oci://$BASE_IMAGE@$digest" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::notice::$ref exists already at $digest, attested; a published imp-base never moves, so this run leaves it alone"
              echo "action=skip" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::$ref exists already at $digest with no attestation from $GITHUB_REPOSITORY; this run attests that digest and leaves the tag alone"
              echo "action=attest" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if ! grep -qF "$ref: not found" <<<"$out"; then
            echo "cannot tell whether $ref exists:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "action=push" >> "$GITHUB_OUTPUT"

      # Loads into the runner's docker, so the image checked is the image
      # pushed. The revision is the commit checked out: on a republish,
      # github.sha is main's head, not the tag's.
      - name: Build image
        if: steps.plan.outputs.action == 'push'
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
          VERSION: ${{ needs.assets.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          revision=$(git rev-parse HEAD)
          docker buildx build images/base --platform linux/amd64 --load \
            --tag "$BASE_IMAGE:$PUSH_TAG" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=imp base image: Ubuntu 24.04 with the Docker engine"

      - name: Check image
        if: steps.plan.outputs.action == 'push'
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
        run: host/check-base-image.sh "$BASE_IMAGE:$PUSH_TAG"

      # The digest comes from the registry, after the push, so the
      # attestation names exactly what was pushed.
      - name: Push image
        id: push
        if: steps.plan.outputs.action == 'push'
        env:
          PUSH_TAG: ${{ needs.assets.outputs.push_tag }}
        run: |
          docker push "$BASE_IMAGE:$PUSH_TAG"
          digest=$(docker buildx imagetools inspect "$BASE_IMAGE:$PUSH_TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image
        if: steps.plan.outputs.action == 'push' || steps.plan.outputs.action == 'attest'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest || steps.plan.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [assets, image]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # --clobber replaces what a failed run left behind
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An operator may pin `latest` on purpose, so a republish of an older
      # release must not move it back. Last, so `latest` never names an image
      # whose release has no assets yet.
      - name: Tag latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest release ($newest); latest stays"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"

  # Points the Homebrew formula at the release's binaries. The tap is a
  # second repository, so this needs the release App installed on it and the
  # Actions variable HOMEBREW_TAP naming it (RELEASING.md); without either,
  # the job is skipped. Only the newest release moves the formula.
  tap:
    needs: [assets, publish]
    if: inputs.tag != '' && vars.RELEASE_APP_ID != '' && vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check newest
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest release ($newest); the formula stays"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.newest.outputs.update == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download assets
        if: steps.newest.outputs.update == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Mint tap token
        id: tap-token
        if: steps.newest.outputs.update == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP }}
          permission-contents: write

      # rebases onto whatever else landed in the tap meanwhile, such as
      # another project's formula
      - name: Update the formula
        if: steps.newest.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          # gh hands git the token as a credential helper, so it never lands
          # in tap/.git/config
          gh auth setup-git
          gh repo clone "$TAP" tap
          mkdir -p tap/Formula
          scripts/build-formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/imp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/imp.rb
          if git diff --cached --quiet; then
            echo "the formula is at $VERSION already"
            exit 0
          fi
          git commit -m "imp $VERSION"
          git pull --rebase
          git push

  # Packs and checks @zgeoff/imp-client for npm, once the release itself is
  # out. Off until the owner sets the Actions variable NPM_PUBLISH_ENABLED to
  # true, after the first publish by hand (RELEASING.md). A version already on
  # npm is skipped, so a republish is safe. Building runs here, without the
  # OIDC token; npm-publish only uploads the checked tarball.
  npm-pack:
    needs: [assets, publish]
    if: inputs.tag != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # npm's `latest` moves only to the newest release, as the image's does;
      # a republish of an older one goes out under `previous`
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          name=$(jq -r .name packages/client/package.json)
          if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$name@$VERSION is on npm already"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$TAG" = "$newest" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=previous" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.plan.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        if: steps.plan.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Pack and check
        if: steps.plan.outputs.publish == 'true'
        run: |
          tarball=$(scripts/pack-client.sh)
          scripts/check-client-package.sh "$tarball"
          mkdir -p npm-tarball
          cp "$tarball" npm-tarball/

      - name: Upload tarball
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: npm-tarball/
          if-no-files-found: error
          retention-days: 7

  # The only job with the OIDC token: no checkout, no install, no build.
  npm-publish:
    needs: npm-pack
    if: needs.npm-pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # npm publishes, not bun: trusted publishing needs npm 11.5.1 or later
      # (Node 24 bundles it), and bun publish has no OIDC support
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Publish
        env:
          DIST_TAG: ${{ needs.npm-pack.outputs.dist_tag }}
        # ./ keeps npm from reading dir/file.tgz as a GitHub user/repo
        run: npm publish ./npm-tarball/*.tgz --provenance --access public --tag "$DIST_TAG"
