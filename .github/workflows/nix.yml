name: Nix

# `nix flake check`: the NixOS module's eval check, and a NixOS VM that runs
# it on a ZFS pool with a stand-in image (docs/guides/nixos.md#test-it).
# eval and vm are required checks in .github/rulesets/main.json: rename both
# together. They run on every pull request, and skip their work, reporting
# success, unless the pull request changes a path that push lists below.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - package.json
      - deploy/**
      - host/scripts/tailscale-up.sh
      - scripts/ci/check-kvm.sh
      - .github/workflows/nix.yml

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the pull request changes the paths push lists; keep both lists
  # alike. This list adds the detector, so a change to it runs the work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Paths changed
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            flake.nix
            flake.lock
            package.json
            deploy/**
            host/scripts/tailscale-up.sh
            scripts/ci/check-kvm.sh
            .github/workflows/nix.yml
            .github/actions/paths-changed/**

  # The module's eval check and the format; no KVM. Only a 'false' skips it,
  # so a failed changes job runs the work rather than pass it.
  eval:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Format
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Eval check
        run: nix build -L --no-link .#checks.x86_64-linux.eval

  # The NixOS VM test. It needs /dev/kvm, and nested KVM inside the VMs.
  vm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # first, so a runner without KVM fails in seconds with the reason
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      # the nix daemon builds as the nixbld users, who must open /dev/kvm
      - name: Open KVM to the builders
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = kvm nixos-test

      - name: VM test
        run: nix build -L --no-link .#checks.x86_64-linux.vm
