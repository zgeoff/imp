name: CI

# The gates every change to main must pass, then the release on main. Each
# gate job is one required status check in .github/rulesets/main.json, so a
# gate's name is part of that contract: rename both together.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# a new push to a PR supersedes its older run; main runs always finish so
# every commit on main gets a verdict
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, but skip hook install/execution regardless
  LEFTHOOK: 0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # setup-bun caches only the bun binary; this keeps the package tarballs
      # so an unchanged lockfile installs without the registry
      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Bun Pin
        run: scripts/check-bun-pin.sh

      - name: Dead Code
        run: bun run deadcode

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # go.mod lives in agent/, so the version and the module cache key both
      # need pointing there
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # gofmt -l lists unformatted files and exits 0 either way
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants to reformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # the runner's apt shellcheck is older and reports a different set of
      # findings, so pin the release the hooks run locally
      - name: Install ShellCheck
        run: |
          cd "$RUNNER_TEMP"
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: |
          shellcheck --version
          scripts/shellcheck.sh

  # Compiles the CLI for every platform, as a release does, and runs the
  # linux-x64 one. The release workflow runs each binary on its own platform;
  # macOS runners cost too much for every pull request.
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:cli

      - name: Run
        run: dist/imp-linux-x64 --version

  # Packs @zgeoff/imp-client as the release publishes it, then installs the
  # tarball into an empty project on the oldest Node it supports.
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pack
        id: pack
        run: echo "tarball=$(scripts/pack-client.sh)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/check-client-package.sh "$TARBALL"

  # Main-only jobs (the release, the KVM end-to-end suite) go below with
  # `if: github.event_name == 'push'` and `needs:` on the gates above.

  # A release takes two runs of this job (RELEASING.md):
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR (version bump and changelog), and the sync step makes
  #   that PR pass the checks job
  # - after the release PR merges, release-please tags vX.Y.Z and creates the
  #   GitHub release, and the job starts release.yml for the tag
  #
  # The job runs only once a release App is configured (vars.RELEASE_APP_ID),
  # as in atc: a release PR opened with GITHUB_TOKEN would get no CI, and the
  # repo would need Actions to be allowed to open PRs. The App's token opens
  # the PR, CI runs on it, and the job turns on auto-merge.
  release-please:
    if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
    needs: [gitleaks, checks, go, shellcheck, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The release PR bumps package versions that bun.lock records too, and
      # writes a CHANGELOG.md that oxfmt reformats: repair both so the PR
      # passes the checks job like any other. The PR output stays a string
      # here: env is evaluated even when the step is skipped, and fromJSON of
      # an empty output would fail the run that tags a release.
      - name: Checkout
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The token goes in the push URL only, never into .git/config; Actions
      # masks it in the log.
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          git fetch --depth=1 origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          bun install
          bun run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$branch"
          fi

      # Reads no release-please outputs: prs_created is false when the open
      # release PR needed no update, for example after a run that failed past
      # creating it. release-please labels its open PR "autorelease: pending".
      # GitHub merges the PR once its required checks pass, or at once when
      # no ruleset requires any.
      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
          done

      # A run of its own, outside this workflow's concurrency group, so an
      # hour-long release never holds up CI on main. release.yml comes from
      # main and checks out the tag. A dispatch is the one GITHUB_TOKEN event
      # that starts a workflow.
      - name: Start the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
