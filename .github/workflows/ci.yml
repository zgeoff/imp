name: CI

# The gates every change to main must pass, then the release on main. Each
# gate job is one required status check in .github/rulesets/main.json, so a
# gate's name is part of that contract: rename both together.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# a new push to a PR supersedes its older run; main runs always finish so
# every commit on main gets a verdict
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, but skip hook install/execution regardless
  LEFTHOOK: 0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # setup-bun caches only the bun binary; this keeps the package tarballs
      # so an unchanged lockfile installs without the registry
      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Bun Pin
        run: scripts/ci/check-bun-pin.sh

      # the whole-tree gates: dead code, format, type-aware lint, doc links,
      # types and every test, as package.json's check script lists them
      - name: Check
        run: bun run check

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bash .claude/skills/docs-writing/scripts/check-length.sh --package README.md

      # an image build's disk hold against what it really takes, on a small
      # loop-mounted XFS of its own, as impd's data dir is; the tests skip
      # without IMP_TEST_SMALL_FS, and the mount needs sudo
      - name: Test Build Disk Hold
        run: |
          command -v mkfs.xfs || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xfsprogs; }
          fs="$RUNNER_TEMP/small-fs"
          truncate -s 4G "$fs.img"
          mkfs.xfs -q "$fs.img"
          mkdir "$fs"
          sudo mount -o loop "$fs.img" "$fs"
          trap 'sudo umount "$fs" && rm -f "$fs.img" && rmdir "$fs"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fs"
          IMP_TEST_SMALL_FS="$fs" bun test packages/daemon/src/images/create-image-builds.test.ts -t 'small filesystem'

      # impd's port of the Dockerfile parser against the Go parser it ports,
      # at the commit behind the pinned frontend (scripts/dockerfile-difftest)
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/dockerfile-difftest/go.mod
          cache-dependency-path: scripts/dockerfile-difftest/go.sum

      - name: Dockerfile Parser Diff
        run: bun scripts/dockerfile-difftest/run.ts --seed 1

      # the agent protocol's generated code and reference against its schema;
      # protoc-gen-go runs from the agent's go.mod, on that module's Go
      - name: Setup Go for the agent
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Generated Protocol Code
        run: |
          bun run gen:proto
          changed="$(git status --porcelain -- agent/internal/proto packages/daemon/src/agent-client/gen docs/reference)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::the generated protocol code differs from proto/; run bun run gen:proto"
            exit 1
          fi

      # the ACME issuer against Pebble and challtestsrv in Docker
      - name: Test ACME
        run: bun run test:pebble

      # its own run: the component tests register a DOM that must not reach
      # the daemon's tests (bunfig.toml pathIgnorePatterns)
      - name: Test Dashboard
        run: bun run test:dashboard

      - name: Build Dashboard
        run: bun run build:dashboard

  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # go.mod lives in agent/, so the version and the module cache key both
      # need pointing there; the key also covers the lint tools and the
      # Dockerfile difftest module
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            agent/tools/go.sum
            scripts/dockerfile-difftest/go.sum

      # gofmt -l lists unformatted files and exits 0 either way
      - name: Format
        run: |
          unformatted=$(gofmt -l . ../scripts/dockerfile-difftest)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants to reformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags root ./...
          go -C ../scripts/dockerfile-difftest vet ./...

      # golangci-lint, govulncheck and deadcode are pinned in tools/go.mod, a
      # module of their own so their dependencies never move the agent's;
      # the root tag adds the root-only tests to what the lint reads
      - name: Lint
        run: |
          go tool -modfile=tools/go.mod golangci-lint run --build-tags root ./...
          cd ../scripts/dockerfile-difftest
          go tool -modfile=../../agent/tools/go.mod golangci-lint run --config ../../agent/.golangci.yml --disable depguard ./...

      - name: Vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

      # deadcode lists functions no binary reaches, tests aside, and exits 0
      # either way
      - name: Dead Code
        run: |
          unreachable=$(go tool -modfile=tools/go.mod deadcode -test=false ./cmd/...)
          if [ -n "$unreachable" ]; then
            echo "::error::only tests call these; delete them or move them into the tests:"
            echo "$unreachable"
            exit 1
          fi

      # gotestsum (pinned as a tool in go.mod) runs go test -race and keeps the
      # JSON event stream, so each run's timings can be compared later
      - name: Test
        run: ../scripts/test-go.sh
        env:
          GO_TEST_JSONFILE: ${{ runner.temp }}/go-test.json

      # The tests behind the root build tag change credentials, chown, mknod
      # and write cgroup.kill, so the whole suite runs again as root. Last: it
      # leaves root-owned files in the build cache.
      - name: Test as root
        run: sudo -E env "PATH=$PATH" go test -tags root -race ./...

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-results
          path: ${{ runner.temp }}/go-test.json

  # Lints shell, workflows and Dockerfiles. The job keeps its first name,
  # since that name is the required check in .github/rulesets/main.json.
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: v1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pinned releases, checked by sum: the runner's apt shellcheck is older
      # and reports a different set of findings, and the hooks run these
      # versions locally
      - name: Install linters
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          fetch() {
            curl -fsSL --retry 3 -o "$1" "$2"
            echo "$3  $1" | sha256sum -c -
          }
          fetch shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" "$SHELLCHECK_SHA256"
          tar -xJf shellcheck.tar.xz
          install "shellcheck-$SHELLCHECK_VERSION/shellcheck" "$bin/"
          fetch shfmt "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64" "$SHFMT_SHA256"
          install shfmt "$bin/"
          fetch actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          tar -xzf actionlint.tar.gz actionlint
          install actionlint "$bin/"
          fetch zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"
          tar -xzf zizmor.tar.gz zizmor
          install zizmor "$bin/"
          fetch hadolint "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64" "$HADOLINT_SHA256"
          install hadolint "$bin/"
          echo "$bin" >>"$GITHUB_PATH"

      - name: ShellCheck and shfmt
        run: |
          shellcheck --version
          shfmt --version
          scripts/ci/shellcheck.sh

      # also runs shellcheck over every run: block
      - name: actionlint
        run: actionlint

      # GH_TOKEN turns on the audits that ask GitHub, such as known-vulnerable
      # actions and impostor commits
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github

      - name: hadolint
        run: hadolint host/Dockerfile images/base/Dockerfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # the shell that production code holds as text; plain `bun test` skips
      # these where shellcheck is missing, and here it is the pinned one
      - name: Embedded shell
        run: >-
          bun test -t shellcheck ./packages/api/src/protocols/login-shell.test.ts
          ./packages/mcp/src/tools/write-script.test.ts ./packages/cli/src/completion.test.ts

  # Compiles the CLI for every platform, as a release does, and runs the
  # linux-x64 one. The release workflow runs each binary on its own platform;
  # macOS runners cost too much for every pull request.
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:cli

      - name: Run
        run: dist/imp-linux-x64 --version

      # The release image compiles impd and the CLI in its own stage, with
      # its own install: build that stage too, so a dependency the stage
      # misses fails here and not first in a release.
      - name: Build the release compile stage
        run: docker build --target compile -f host/Dockerfile .

  # Packs @zgeoff/imp-client as the release publishes it, then installs the
  # tarball into an empty project on the oldest Node it supports, and smokes
  # it against impd's app under Node, Bun and a compiled Bun binary.
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pack
        id: pack
        run: echo "tarball=$(scripts/release/pack-client.sh)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/release/check-client-package.sh "$TARBALL"

      - name: Smoke the package under Node, Bun and a compiled binary
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/release/check-client-runtimes.sh "$TARBALL"

  # Boots real microVMs: the fast end-to-end set in its three groups
  # (FAST_GROUPS in e2e/lib/suites.ts, e2e/test-e2e.sh --group N),
  # each against a dev instance on its own runner's KVM. The `e2e` job below
  # is the required check over all three.
  e2e-group:
    name: e2e (group ${{ matrix.group }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 25
    strategy:
      # every group reports, so one failure does not hide another's
      fail-fast: false
      matrix:
        include:
          # the dashboard suite's browser
          - group: 1
            browser: true
            host-tests: false
          # HOST_TESTS_GROUP in suites.ts: the host tests run once
          - group: 2
            browser: false
            host-tests: true
          - group: 3
            browser: false
            host-tests: false
    env:
      # the fast set at reduced size for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      # sparse, so only what the imps write takes disk
      IMP_STORAGE_GIB: 40
      # the tag e2e-build loads; one checkout per runner needs no tag of its own
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
      # PRs read the caches main writes; their own writes would only crowd
      # the repo's cache quota. One group writes on main, so three writers
      # never race on the same scopes
      WRITE_CACHE: ${{ github.event_name == 'push' && matrix.group == 1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # first, so a runner without KVM fails before any build
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      # The cpu suite fails in CI unless a private cgroup namespace gets the
      # cpu controller. Docker's containers live under system.slice: hand cpu
      # down to it, then show what a container gets. Never fails by itself; the
      # image is host/Dockerfile's runtime base, pinned the same.
      - name: Hand the cpu controller to containers
        run: |
          for dir in /sys/fs/cgroup /sys/fs/cgroup/system.slice; do
            if ! grep -qw cpu "$dir/cgroup.subtree_control"; then
              echo +cpu | sudo tee "$dir/cgroup.subtree_control" >/dev/null || true
            fi
          done
          docker run --rm --cgroupns=private \
            debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a \
            cat /sys/fs/cgroup/cgroup.controllers || true

      # The ksm suite needs ksmd running. KSM is global to the kernel, so it is
      # turned on here only, on this runner's own VM, and the suite skips on
      # any host where it is off. The scan rate is high so merges come in
      # minutes; ubuntu-24.04 runs Linux 6.17, past the 6.10 IMP_KSM needs.
      - name: Turn KSM on for this runner
        run: |
          uname -r
          echo 1 | sudo tee /sys/kernel/mm/ksm/use_zero_pages >/dev/null
          echo 1000 | sudo tee /sys/kernel/mm/ksm/pages_to_scan >/dev/null
          echo 1 | sudo tee /sys/kernel/mm/ksm/run >/dev/null
          grep -H . /sys/kernel/mm/ksm/run /sys/kernel/mm/ksm/pages_to_scan /sys/kernel/mm/ksm/use_zero_pages

      # /mnt is the runner's larger temp disk; the XFS file goes there when
      # the image has one. CI must not pass --clean to the harness: it
      # refuses to wipe a data dir outside .data/ that holds no imp.xfs, and
      # a fresh runner has nothing to clean.
      - name: Pick the data dir
        run: |
          df -h / /mnt || true
          if mountpoint -q /mnt; then
            data=/mnt/imp-e2e
          else
            data=$GITHUB_WORKSPACE/.data/ci
          fi
          sudo mkdir -p "$data"
          sudo chown "$(id -u):$(id -g)" "$data"
          echo "IMP_DEV_DATA=$data" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # The host tests (`bun run test:host`) as root: the real nft and
      # iptables in fresh namespaces, packets between veth pairs included.
      # Plain `bun test` skips them on runners that restrict unprivileged
      # namespaces; here a skip fails.
      - name: Host networking tests
        if: matrix.host-tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          sudo env "PATH=$PATH" IMP_HOST_TESTS=required bun run test:host

      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: ${{ env.WRITE_CACHE }}

      # The dashboard suite's browser. The locked Playwright pins its Chromium
      # build, so its version keys the cache; on a miss the suite downloads it.
      - name: Read the Playwright version
        if: matrix.browser
        id: playwright
        working-directory: packages/dashboard
        run:
          echo "version=$(bun -p "require('@playwright/test/package.json').version")"
          >>"$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        if: matrix.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The registry suite's registry runs on loopback under this name, since
      # the docker proxy refuses an IP or localhost; the suite trusts its
      # certificate in /etc/docker/certs.d with sudo
      - name: Name the e2e registry
        run: echo '127.0.0.1 imp-e2e-registry.test' | sudo tee -a /etc/hosts

      # No TAILSCALE_AUTHKEY here: the fast set has no tailscale suite, and
      # outside acceptance a missed timing limit only warns.
      - name: End-to-end tests
        run: e2e/test-e2e.sh --group ${{ matrix.group }}

      # The steps below also run after a failure or a timeout, with or
      # without a container, so none of them may fail the job.
      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache/e2e
          docker logs imp-dev >.cache/e2e/impd.log 2>&1 || true
          du -h "$IMP_DEV_DATA/imp.xfs" || true
          df -h / /mnt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.group }}
          # the dashboard suite's Playwright traces and screenshots
          path: |
            .cache/e2e/
            packages/dashboard/.test-results/
          if-no-files-found: ignore
          retention-days: 14

      # the runner is thrown away, so no sleeping imps to keep
      - name: Remove the dev instance
        if: always()
        run: docker rm -f imp-dev || true

  # The required check and release-please's gate: every e2e group passed. It
  # runs whatever they did, so a group that failed, was cancelled or was
  # skipped fails it, and never passes as a skip.
  e2e:
    if: always()
    needs: [e2e-group]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every e2e group to pass
        env:
          RESULT: ${{ needs.e2e-group.result }}
        run: |
          echo "e2e groups: $RESULT"
          test "$RESULT" = success

  # The ZFS storage backend on real pools: scripts/test-zfs.sh runs its tests
  # on a throwaway pool in a sparse file, with the zfs module Ubuntu's kernel
  # ships; then scripts/zfs-host-test.sh runs real imps on a second such pool
  # through the lifecycle, checkpoints, disks, sleep, backups, boot-templates
  # and moves suites and prints the ZFS timings. Not a required check; the
  # fake zfs in the unit tests runs in `checks` either way.
  zfs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 30
    env:
      # as the e2e job: reduced sizes for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      # the tag e2e-build loads; one checkout per runner needs no tag of its own
      IMP_HOST_IMAGE: imp-host:dev
      IMP_HOST_IMAGE_READY: 1
      IMP_ZFS_E2E_SUITES: lifecycle,checkpoints,disks,sleep,backups,boot-templates,moves
      IMP_ZFS_TEST_UNIT: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      # the pool files go on /mnt, the runner's larger temp disk, when it has one
      - name: Pick the work dir
        run: |
          df -h / /mnt || true
          if mountpoint -q /mnt; then
            work=/mnt/imp-zfs
          else
            work=$RUNNER_TEMP/imp-zfs
          fi
          sudo mkdir -p "$work"
          sudo chown "$(id -u):$(id -g)" "$work"
          echo "IMP_ZFS_TEST_DIR=$work" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # ARC defaults to half of RAM; capped, as deploy/bootstrap.sh does, so
      # the guests keep theirs
      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zfsutils-linux
          # zfs.ko sits in linux-modules-extra on some runner kernels
          modinfo zfs >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe zfs zfs_arc_max=1073741824
          echo 1073741824 | sudo tee /sys/module/zfs/parameters/zfs_arc_max >/dev/null
          # zfsutils 2.2.2-0ubuntu9.5 and later refuse to run as a user
          sudo zfs version

      # the unit part runs here, in its own temp dir, so a failure names it
      - name: ZFS backend tests
        run: sudo env "PATH=$PATH" IMP_ZFS_TEST_DIR= scripts/test-zfs.sh

      # reads the caches only: e2e group 1 writes the same scopes on push, and
      # two writers at once can fail its build
      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: false

      - name: Imps on ZFS
        run: scripts/zfs-host-test.sh

      # also after a failed suite: the script writes the summary either way
      - name: Job summary
        if: always()
        run: |
          {
            echo "Nested KVM on a shared runner, a pool in a sparse file and a 1 GiB ARC: these"
            echo "numbers do not compare directly with XFS ones."
            echo
            echo '```text'
            cat "$IMP_ZFS_TEST_DIR/summary.txt" 2>/dev/null || echo "no summary: the run stopped before it"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # also after a failure or a timeout, so none of these may fail the job
      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache/e2e
          cp "$IMP_ZFS_TEST_DIR"/{impd.log,e2e.log,summary.txt} .cache/e2e/ 2>/dev/null || true
          docker logs imp-zfs >>.cache/e2e/impd.log 2>&1 || true
          df -h / /mnt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfs-e2e-results
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # Main-only jobs go below with `if: github.event_name == 'push'` and
  # `needs:` on the gates above.

  # A release takes two runs of this job (docs/runbooks/releasing.md):
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR (version bump and changelog), and the sync step makes
  #   that PR pass the checks job
  # - after the release PR merges, release-please tags vX.Y.Z and creates the
  #   GitHub release, and the job starts release.yml for the tag
  #
  # The job runs only once a release App is configured (vars.RELEASE_APP_ID),
  # as in atc: a release PR opened with GITHUB_TOKEN would get no CI, and the
  # repo would need Actions to be allowed to open PRs. The App's token opens
  # the PR, CI runs on it, and the job turns on auto-merge.
  release-please:
    if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
    needs: [gitleaks, checks, go, shellcheck, cli, client, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # what the steps below use it for: release-please, the push to the
          # release branch and the auto-merge; the App holds no more
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The release PR bumps package versions that bun.lock records too, and
      # writes a CHANGELOG.md that oxfmt reformats: repair both so the PR
      # passes the checks job like any other. The PR output stays a string
      # here: env is evaluated even when the step is skipped, and fromJSON of
      # an empty output would fail the run that tags a release.
      - name: Checkout
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # no cache: a job holding the App token must not run a Bun binary that
      # another run's cache entry could have replaced
      - name: Setup Bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      # The token goes in the push URL only, never into .git/config; Actions
      # masks it in the log.
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          git fetch --depth=1 origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          bun install
          bun run format
          # One more pass at most (.oxfmtrc.test.ts): if the
          # second pass still leaves changes, the formatter does not settle
          if ! bun run format:check; then
            bun run format
            if ! bun run format:check; then
              echo "::error::bun run format still changes the release pull request after two passes"
              exit 1
            fi
          fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$branch"
          fi

      # Reads no release-please outputs: prs_created is false when the open
      # release PR needed no update, for example after a run that failed past
      # creating it. release-please labels its open PR "autorelease: pending".
      # GitHub merges the PR once its required checks pass, or at once when
      # no ruleset requires any.
      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
          done

      # A run of its own, outside this workflow's concurrency group, so an
      # hour-long release never holds up CI on main. release.yml comes from
      # main and checks out the tag. A dispatch is the one GITHUB_TOKEN event
      # that starts a workflow.
      - name: Start the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
