name: CI

# The gates every change to main must pass, then the release on main. Each
# gate job is one required status check in .github/rulesets/main.json, so a
# gate's name is part of that contract: rename both together.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# a new push to a PR supersedes its older run; main runs always finish so
# every commit on main gets a verdict
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never commits, but skip hook install/execution regardless
  LEFTHOOK: 0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # setup-bun caches only the bun binary; this keeps the package tarballs
      # so an unchanged lockfile installs without the registry
      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun run audit

      - name: Bun Pin
        run: scripts/check-bun-pin.sh

      - name: Dead Code
        run: bun run deadcode

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # the ACME issuer against Pebble and challtestsrv in Docker
      - name: Test ACME
        run: bun run test:pebble

      # its own run: the component tests register a DOM that must not reach
      # the daemon's tests (bunfig.toml pathIgnorePatterns)
      - name: Test Dashboard
        run: bun run test:dashboard

      - name: Build Dashboard
        run: bun run build:dashboard

  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # go.mod lives in agent/, so the version and the module cache key both
      # need pointing there
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # gofmt -l lists unformatted files and exits 0 either way
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants to reformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # the runner's apt shellcheck is older and reports a different set of
      # findings, so pin the release the hooks run locally
      - name: Install ShellCheck
        run: |
          cd "$RUNNER_TEMP"
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: |
          shellcheck --version
          scripts/shellcheck.sh

  # Compiles the CLI for every platform, as a release does, and runs the
  # linux-x64 one. The release workflow runs each binary on its own platform;
  # macOS runners cost too much for every pull request.
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:cli

      - name: Run
        run: dist/imp-linux-x64 --version

      # The release image compiles impd and the CLI in its own stage, with
      # its own install: build that stage too, so a dependency the stage
      # misses fails here and not first in a release.
      - name: Build the release compile stage
        run: docker build --target compile -f host/Dockerfile .

  # Packs @zgeoff/imp-client as the release publishes it, then installs the
  # tarball into an empty project on the oldest Node it supports.
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pack
        id: pack
        run: echo "tarball=$(scripts/pack-client.sh)" >> "$GITHUB_OUTPUT"

      - name: Check the package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/check-client-package.sh "$TARBALL"

  # Boots real microVMs: the fast end-to-end set (scripts/test-e2e.sh --only
  # fast) against a dev instance on the runner's own KVM. A required check,
  # and release-please waits for it (docs/guides/development.md, "CI").
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 25
    env:
      # the fast set at reduced size for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      # sparse, so only what the imps write takes disk
      IMP_STORAGE_GIB: 40
      IMP_HOST_IMAGE_READY: 1
      # PRs read the caches main writes; their own writes would only crowd
      # the repo's cache quota
      WRITE_CACHE: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # first, so a runner without KVM fails before any build
      - name: Check KVM
        run: scripts/check-kvm.sh

      # /mnt is the runner's larger temp disk; the XFS file goes there when
      # the image has one. CI must not pass --clean to the harness: it
      # refuses to wipe a data dir outside .data/ that holds no imp.xfs, and
      # a fresh runner has nothing to clean.
      - name: Pick the data dir
        run: |
          df -h / /mnt || true
          if mountpoint -q /mnt; then
            data=/mnt/imp-e2e
          else
            data=$GITHUB_WORKSPACE/.data/ci
          fi
          sudo mkdir -p "$data"
          sudo chown "$(id -u):$(id -g)" "$data"
          echo "IMP_DEV_DATA=$data" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: ${{ env.WRITE_CACHE }}

      # The dashboard suite's browser. The locked Playwright pins its Chromium
      # build, so its version keys the cache; on a miss the suite downloads it.
      - name: Read the Playwright version
        id: playwright
        working-directory: packages/dashboard
        run:
          echo "version=$(bun -p "require('@playwright/test/package.json').version")"
          >>"$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No TAILSCALE_AUTHKEY here: the fast set has no tailscale suite, and
      # outside acceptance a missed timing limit only warns.
      - name: End-to-end tests
        run: scripts/test-e2e.sh --only fast

      # The steps below also run after a failure or a timeout, with or
      # without a container, so none of them may fail the job.
      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache/e2e
          docker logs imp-dev >.cache/e2e/impd.log 2>&1 || true
          du -h "$IMP_DEV_DATA/imp.xfs" || true
          df -h / /mnt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          # the dashboard suite's Playwright traces and screenshots
          path: |
            .cache/e2e/
            packages/dashboard/.test-results/
          if-no-files-found: ignore
          retention-days: 14

      # the runner is thrown away, so no sleeping imps to keep
      - name: Remove the dev instance
        if: always()
        run: docker rm -f imp-dev || true

  # The ZFS storage backend on real pools: scripts/test-zfs.sh runs its tests
  # on a throwaway pool in a sparse file, with the zfs module Ubuntu's kernel
  # ships; then scripts/zfs-host-test.sh runs real imps on a second such pool
  # through the lifecycle, checkpoints, disks and sleep suites and prints the ZFS
  # timings. Not a required check; the fake zfs in the unit tests runs in
  # `checks` either way.
  zfs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # a cache miss rebuilds the guest kernel, about 10 minutes on 4 cores
    timeout-minutes: 30
    env:
      # as the e2e job: reduced sizes for a 4-core, 16 GB runner
      E2E_RAM_BUDGET_MIB: 4096
      IMP_DEFAULT_MEMORY_MIB: 1024
      IMP_KERNEL: .cache/ci/vmlinux
      IMP_SYSTEM_DRIVE: .cache/ci/imp-system.squashfs
      IMP_HOST_IMAGE_READY: 1
      IMP_ZFS_E2E_SUITES: lifecycle,checkpoints,disks,sleep,backups
      IMP_ZFS_TEST_UNIT: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check KVM
        run: scripts/check-kvm.sh

      # the pool files go on /mnt, the runner's larger temp disk, when it has one
      - name: Pick the work dir
        run: |
          df -h / /mnt || true
          if mountpoint -q /mnt; then
            work=/mnt/imp-zfs
          else
            work=$RUNNER_TEMP/imp-zfs
          fi
          sudo mkdir -p "$work"
          sudo chown "$(id -u):$(id -g)" "$work"
          echo "IMP_ZFS_TEST_DIR=$work" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # ARC defaults to half of RAM; capped, as deploy/bootstrap.sh does, so
      # the guests keep theirs
      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zfsutils-linux
          # zfs.ko sits in linux-modules-extra on some runner kernels
          modinfo zfs >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe zfs zfs_arc_max=1073741824
          echo 1073741824 | sudo tee /sys/module/zfs/parameters/zfs_arc_max >/dev/null
          # zfsutils 2.2.2-0ubuntu9.5 and later refuse to run as a user
          sudo zfs version

      # the unit part runs here, in its own temp dir, so a failure names it
      - name: ZFS backend tests
        run: sudo env "PATH=$PATH" IMP_ZFS_TEST_DIR= scripts/test-zfs.sh

      # reads the caches only: the required e2e job writes the same scopes on
      # push, and two writers at once can fail its build
      - name: Build kernel, system drive and host image
        uses: ./.github/actions/e2e-build
        with:
          write-cache: false

      - name: Imps on ZFS
        run: scripts/zfs-host-test.sh

      # also after a failed suite: the script writes the summary either way
      - name: Job summary
        if: always()
        run: |
          {
            echo "Nested KVM on a shared runner, a pool in a sparse file and a 1 GiB ARC: these"
            echo "numbers do not compare directly with the XFS ones in STATUS.md."
            echo
            echo '```text'
            cat "$IMP_ZFS_TEST_DIR/summary.txt" 2>/dev/null || echo "no summary: the run stopped before it"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # also after a failure or a timeout, so none of these may fail the job
      - name: Collect logs
        if: always()
        run: |
          mkdir -p .cache/e2e
          cp "$IMP_ZFS_TEST_DIR"/{impd.log,e2e.log,summary.txt} .cache/e2e/ 2>/dev/null || true
          docker logs imp-zfs >>.cache/e2e/impd.log 2>&1 || true
          df -h / /mnt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfs-e2e-results
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # Main-only jobs go below with `if: github.event_name == 'push'` and
  # `needs:` on the gates above.

  # A release takes two runs of this job (RELEASING.md):
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR (version bump and changelog), and the sync step makes
  #   that PR pass the checks job
  # - after the release PR merges, release-please tags vX.Y.Z and creates the
  #   GitHub release, and the job starts release.yml for the tag
  #
  # The job runs only once a release App is configured (vars.RELEASE_APP_ID),
  # as in atc: a release PR opened with GITHUB_TOKEN would get no CI, and the
  # repo would need Actions to be allowed to open PRs. The App's token opens
  # the PR, CI runs on it, and the job turns on auto-merge.
  release-please:
    if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
    needs: [gitleaks, checks, go, shellcheck, cli, client, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The release PR bumps package versions that bun.lock records too, and
      # writes a CHANGELOG.md that oxfmt reformats: repair both so the PR
      # passes the checks job like any other. The PR output stays a string
      # here: env is evaluated even when the step is skipped, and fromJSON of
      # an empty output would fail the run that tags a release.
      - name: Checkout
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        if: steps.release.outputs.prs_created == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The token goes in the push URL only, never into .git/config; Actions
      # masks it in the log.
      - name: Sync lockfile and formatting on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          git fetch --depth=1 origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          bun install
          bun run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfile and format release files"
            git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$branch"
          fi

      # Reads no release-please outputs: prs_created is false when the open
      # release PR needed no update, for example after a run that failed past
      # creating it. release-please labels its open PR "autorelease: pending".
      # GitHub merges the PR once its required checks pass, or at once when
      # no ruleset requires any.
      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
          done

      # A run of its own, outside this workflow's concurrency group, so an
      # hour-long release never holds up CI on main. release.yml comes from
      # main and checks out the tag. A dispatch is the one GITHUB_TOKEN event
      # that starts a workflow.
      - name: Start the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
