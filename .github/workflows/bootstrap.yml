name: Bootstrap

# Runs deploy/bootstrap.sh twice in a systemd container on Debian 13 and
# Ubuntu 24.04 and 26.04 (test/test-bootstrap.sh), and checks the second
# run changes nothing, on XFS and on a ZFS pool. A stand-in image replaces
# the release image, so the health check, which boots an imp, runs by hand:
# test/test-bootstrap.sh --image imp-host:<tag> --health. The bootstrap job
# is a required check in .github/rulesets/main.json: rename both together. It
# runs on every pull request, and skips its work, reporting success, unless the
# pull request changes a path that push lists below.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - deploy/**
      - test/test-bootstrap.sh
      - scripts/ci/check-kvm.sh
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the pull request changes the paths push lists; keep both lists
  # alike. This list adds the detector, so a change to it runs the work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Paths changed
        id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            deploy/**
            test/test-bootstrap.sh
            scripts/ci/check-kvm.sh
            .github/workflows/bootstrap.yml
            .github/actions/paths-changed/**

  # Only a 'false' skips it, so a failed changes job runs the work rather than
  # pass it.
  bootstrap:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # bootstrap.sh refuses a host without KVM; fail here first, and clearly
      - name: Check KVM
        run: scripts/ci/check-kvm.sh

      # the ZFS leg makes a pool from the container, with this kernel's
      # module; zfs.ko sits in linux-modules-extra on some runner kernels
      - name: Load ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zfsutils-linux
          modinfo zfs >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe zfs
          cat /sys/module/zfs/version

      - name: Test
        run: test/test-bootstrap.sh --stub --zfs
