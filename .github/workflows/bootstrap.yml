name: Bootstrap

# Runs deploy/bootstrap.sh twice in a systemd container on Debian 13 and
# Ubuntu 24.04 (scripts/test-bootstrap.sh) and checks the second run changes
# nothing. A stand-in image replaces the release image, so the health check,
# which boots an imp, runs by hand: scripts/test-bootstrap.sh --image
# imp-host:<tag> --health.
on:
  pull_request:
    paths:
      - deploy/**
      - scripts/test-bootstrap.sh
      - .github/workflows/bootstrap.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - scripts/test-bootstrap.sh
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # bootstrap.sh refuses a host without KVM; fail here first, and clearly
      - name: Check KVM
        run: |
          ls -l /dev/kvm
          grep -cwE 'vmx|svm' /proc/cpuinfo

      - name: Test
        run: scripts/test-bootstrap.sh --stub
