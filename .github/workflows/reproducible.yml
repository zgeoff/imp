name: Reproducible

# Rebuilds the guest kernel and the system drive from scratch and checks they
# come out the same bytes (host/check-reproducible.sh). Two cold kernel
# builds are too slow for every push, so it runs by hand; the release
# pipeline can call it too.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-files:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check
        run: host/check-reproducible.sh
