# Whether a pull request changes any of the given paths, for a workflow that
# runs on every pull request so its jobs can be required checks: a workflow
# that on.pull_request.paths skips never reports, and blocks the merge. A job
# skipped by its `if:` reports success. On any other event it answers 'true',
# as those triggers keep their own paths filters. Run it after a checkout with
# fetch-depth 2: the pull request's merge commit and its parents.
name: Paths changed
description: Answer whether the pull request changes any of the given paths

inputs:
  paths:
    description: >-
      Path patterns, one per line, as in on.pull_request.paths; `*` and `**` both match across `/`
    required: true

outputs:
  changed:
    description: "'true' when a changed file matches a pattern, else 'false'"
    value: ${{ steps.match.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Match changed files
      id: match
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PATTERNS: ${{ inputs.paths }}
      run: |
        if [[ $EVENT != pull_request ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # the merge commit against the base it merges into: what the merge
        # changes. --no-renames lists a moved file's old path too, and -z
        # leaves a path unquoted whatever its characters. A file, not a
        # process substitution, so a failed diff fails the step.
        git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
        changed=false
        while IFS= read -r -d '' file; do
          while IFS= read -r pattern; do
            # shellcheck disable=SC2053 # the pattern is a glob on purpose
            if [[ -n $pattern && $file == $pattern ]]; then
              echo "$file matches $pattern"
              changed=true
            fi
          done <<< "$PATTERNS"
        done < "$RUNNER_TEMP/changed-files"
        echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"
